<svg width="920" height="290" viewBox="0 0 920 290" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121a"/>
      <stop offset="1" stop-color="#1a1a26"/>
    </linearGradient>
    <style>
      .card { fill: url(#bg); stroke: #2a2a3a; stroke-width: 1; }
      .name { fill: #f0f0f5; font-size: 19px; font-weight: 700; }
      .stat { fill: #a0a0b5; font-size: 14px; }
      .stars { fill: #f0c419; font-size: 14px; font-weight: 600; }
      .prs { fill: #6de37e; font-size: 14px; font-weight: 600; }
    </style>
  </defs>

  <!-- row 1 -->
  <g transform="translate(20,20)">
    <rect class="card" width="280" height="110" rx="14"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#3178c6"/>
    <text x="24" y="38" class="name">aws-cdk-cli</text>
    <text x="24" y="66" class="stat">⭐ <tspan class="stars">105</tspan></text>
    <text x="24" y="90" class="stat">🔀 <tspan class="prs">13 merged PRs</tspan></text>
  </g>

  <g transform="translate(320,20)">
    <rect class="card" width="280" height="110" rx="14"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#f34b7d"/>
    <text x="24" y="38" class="name">mlx</text>
    <text x="24" y="66" class="stat">⭐ <tspan class="stars">28.1k</tspan></text>
    <text x="24" y="90" class="stat">🔀 <tspan class="prs">10 merged PRs</tspan></text>
  </g>

  <g transform="translate(620,20)">
    <rect class="card" width="280" height="110" rx="14"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#3178c6"/>
    <text x="24" y="38" class="name">NemoClaw</text>
    <text x="24" y="66" class="stat">⭐ <tspan class="stars">22.3k</tspan></text>
    <text x="24" y="90" class="stat">🔀 <tspan class="prs">4 merged PRs</tspan></text>
  </g>

  <!-- row 2 -->
  <g transform="translate(170,160)">
    <rect class="card" width="280" height="110" rx="14"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#dea584"/>
    <text x="24" y="38" class="name">lancedb</text>
    <text x="24" y="66" class="stat">⭐ <tspan class="stars">11.3k</tspan></text>
    <text x="24" y="90" class="stat">🔀 <tspan class="prs">3 merged PRs</tspan></text>
  </g>

  <g transform="translate(470,160)">
    <rect class="card" width="280" height="110" rx="14"/>
    <rect x="0" y="0" width="6" height="110" rx="3" fill="#3178c6"/>
    <text x="24" y="38" class="name">pactus-wallet</text>
    <text x="24" y="66" class="stat">⭐ <tspan class="stars">10</tspan></text>
    <text x="24" y="90" class="stat">🔀 <tspan class="prs">3 merged PRs</tspan></text>
  </g>
</svg>
